# Example deployment (Dokploy "Raw" compose or plain docker compose). Put it behind your VPN: the dashboard has
# no login of its own and its buttons can reboot the host. Remove the integrations you don't run.
services:
  dashboard:
    build: .
    restart: unless-stopped
    environment:
      MOUNTS: "system=/:/host/fs/system,data=/srv:/data"
      NET_IFACES: "eth0=lan,tailscale0=tailscale"
      SERVICES: "photos=https://photos.example.com,drive=https://drive.example.com"
      DDNS_HOST: "home.example.com"
      GARAGE_ADMIN_URL: "http://garage:3903"
      DOKPLOY_URL: "http://dokploy:3000"
      DOKPLOY_PUBLIC_URL: "https://dokploy.example.com"
      KUMA_URL: "http://uptime-kuma:3001"
      KUMA_PUBLIC_URL: "https://kuma.example.com"
      NAVIDROME_PUBLIC_URL: "https://music.example.com"
      MINIFLUX_PUBLIC_URL: "https://rss.example.com"
      # Docker through the read-only proxy below (a :ro socket mount still allows the whole Docker API).
      DOCKER_HOST: "tcp://docker-proxy:2375"
      # Your reverse proxy's VPN-only route must add `X-Keep-Gate: <this>`; without it the API answers 403, so other
      # containers that can reach :8090 can't use it. Generate one: openssl rand -hex 32
      KEEP_GATE: ${KEEP_GATE}
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/hostname:/host/etc/hostname:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/lib/keep-dashboard:/host/fs/system:ro
      - /srv/keep-dashboard:/data
      # Optional integrations:
      - /srv/garage/garage.toml:/host/garage.toml:ro
      - /etc/dokploy-api.env:/host/dokploy-api.env:ro
      - /srv/uptime-kuma/metrics.key:/host/kuma-metrics.key:ro
      - /srv/tools/speedtest:/host/speedtest:ro
    depends_on:
      - docker-proxy
    networks:
      - default
      - docker-api
    # Route it through your reverse proxy (VPN-only, adding X-Keep-Gate) rather than publishing a port.

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

networks:
  docker-api:
    internal: true
